name: Hugo ブログ草案自動生成

on:
  workflow_dispatch:
  # cron は mini-pc1 の trigger_workflow.py 経由で呼び出す
  # スケジュール追加は L3（代表承認）が必要なため workflow_dispatch のみで運用開始

permissions:
  contents: write

jobs:
  generate:
    name: ブログ草案生成 → develop push → Issue 起票
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Python 依存ライブラリ確認
        run: |
          python3 -c "import anthropic, requests" 2>/dev/null || \
            pip3 install --quiet anthropic requests

      - name: ブログ草案生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/hugo_blog_draft.py

      - name: 失敗時に Issue 起票
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[⚠️ 自動通知] Hugo ブログ草案生成が失敗しました',
              labels: ['workflow-failure'],
              body: [
                '## ワークフロー失敗通知',
                '',
                `- **実行URL**: ${runUrl}`,
                '',
                'Hugoブログ草案生成ワークフローが失敗しました。手動で確認してください。',
              ].join('\n'),
            });
