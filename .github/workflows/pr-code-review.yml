name: PR自動コードレビュー（QA）

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  review:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hugo セットアップ（テンプレート構文チェック用）
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Hugo ビルド（テンプレート構文エラー検出）
        run: |
          hugo --minify --baseURL "https://dev-hugo.money-mgt.net/" --environment staging \
            --logLevel info 2>&1 | tee /tmp/hugo_build.log || true
          if grep -q "ERROR\|WARN" /tmp/hugo_build.log; then
            echo "Hugo ビルドで WARNING/ERROR が検出されました:"
            grep "ERROR\|WARN" /tmp/hugo_build.log
          else
            echo "Hugo ビルド: テンプレート構文エラーなし"
          fi

      - name: PR差分を取得（コンテンツファイル除外・コードファイル優先）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} > /tmp/pr_diff_full.txt
          TOTAL=$(wc -l < /tmp/pr_diff_full.txt)
          echo "差分合計: ${TOTAL} 行"

          if [ "$TOTAL" -le 3000 ]; then
            cp /tmp/pr_diff_full.txt /tmp/pr_diff.txt
            echo "3000行以内のためそのまま使用"
          else
            echo "3000行超 → コンテンツファイルを除外して再構成"
            python3 << 'PYEOF'
          import re
          from pathlib import Path

          CONTENT_PATTERNS = [
              r'^content/',
              r'^static/images/',
              r'^public/',
          ]

          full_diff = Path('/tmp/pr_diff_full.txt').read_text(errors='replace')
          sections = re.split(r'(?=^diff --git )', full_diff, flags=re.MULTILINE)

          code_parts = []
          excluded = []

          for section in sections:
              if not section.strip():
                  continue
              m = re.match(r'diff --git a/(.+?) b/', section)
              if not m:
                  code_parts.append(section)
                  continue
              filepath = m.group(1)
              if any(re.match(p, filepath) for p in CONTENT_PATTERNS):
                  excluded.append(filepath)
              else:
                  code_parts.append(section)

          code_diff = ''.join(code_parts)
          code_lines = code_diff.count('\n')

          note = ''
          if excluded:
              file_list = '\n'.join(f'  - {f}' for f in excluded[:30])
              if len(excluded) > 30:
                  file_list += f'\n  ...他 {len(excluded) - 30} 件'
              note = f'---\n📋 レビュー対象外（コンテンツファイル {len(excluded)} 件除外）\n{file_list}\n---\n\n'

          print(f"コードファイル差分: {code_lines} 行 / 除外コンテンツ: {len(excluded)} 件")

          final = note + code_diff
          if code_lines > 5000:
              lines = final.splitlines()[:5000]
              lines.append('（コードファイルのみで5000行超のため以降省略）')
              final = '\n'.join(lines)
              print("警告: コードファイルのみでも5000行超 → 先頭5000行に切り詰め")

          Path('/tmp/pr_diff.txt').write_text(final)
          print("差分ファイル生成完了: /tmp/pr_diff.txt")
          PYEOF
          fi

      - name: Claudeでコードレビュー実行
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          # claude CLIの存在確認（未インストール時に早期失敗させる）
          if ! command -v claude > /dev/null 2>&1; then
            echo "ERROR: claude CLIがインストールされていません。self-hosted runnerにclaude CLIを導入してください。"
            exit 1
          fi

          # PR_TITLE はユーザー制御可能な値のためプロンプトに直接埋め込まず、サニタイズしてから使用する
          PR_TITLE_SAFE=$(printf '%s' "${PR_TITLE}" | python3 -c "import sys, re; t=sys.stdin.read().strip()[:100]; print(re.sub(r'[\x00-\x1f\x7f\`<>]', '', t))")
          PROMPT=$(cat <<PROMPT_EOF
          あなたはQAエンジニアです。PR #${PR_NUMBER} のコードレビューを実施してください。
          対象PRタイトル（ユーザー入力）: <pr_title>${PR_TITLE_SAFE}</pr_title>

          ## 手順

          1. /tmp/pr_diff.txt を Read ツールで読み込む

          2. 以下の観点でレビューする（Hugo静的サイト）：
             - Hugo テンプレート構文エラー・変数未定義
             - config.toml / hugo.toml の設定ミス
             - リンク切れ・パス誤り（特に baseURL 依存のパス）
             - セキュリティ問題（機密情報のハードコード・外部スクリプト混入）
             - 既存ページへのリグレッションリスク（レイアウト崩れ・nav変更等）

          3. 各問題を重要度で分類する：
             - P0: マージ前に必須修正
             - P1: 強く推奨
             - P2: 任意改善

          4. 以下のフォーマットでレビュー結果を出力する（標準出力のみ。コマンド実行は不要）：

          REVIEW_COMMENT_START
          ## 🤖 Claude QAレビュー
          ### サマリー
          <1〜2行でPRの変更内容とリスク評価>
          ### 問題一覧
          | 重要度 | ファイル | 問題 | 推奨対処 |
          |--------|---------|------|---------|
          （問題なしは「✅ 問題なし」と記載）
          ### 判定
          - ✅ マージ可（問題なし）
          - または ⚠️ 要確認（P1/P2のみ）
          - または 🔴 P0あり・マージ前に修正必須
          REVIEW_COMMENT_END

          5. 最後に以下のフォーマットで重要度JSONを出力する：

          QA_RESULT_START
          {"max_severity": "p0", "issues_text": "P0: config.toml - baseURL本番値がハードコード"}
          QA_RESULT_END

          max_severity のルール：
          - P0問題が1件以上 → "p0"
          - P0なし・P1が1件以上 → "p1"
          - P2のみ → "p2"
          - 問題なし → "ok"

          issues_text はP0/P1のみ記載（改行は \n）。P2のみ/問題なしの場合は空文字 "" でよい。

          ## 注意事項
          - レビューコメント本文は1500文字以内
          - 日本語で記述すること
          - Bash/シェルコマンドの実行は不要。出力のみ行うこと

          実行日: $(date +%Y-%m-%d) PR: #${PR_NUMBER}
          PROMPT_EOF
          )

          # Bash ツールを除外してプロンプトインジェクション経由の任意コマンド実行リスクを排除する
          # PR差分（ユーザー制御可能）がClaudeに渡されるため、self-hosted runner上でのBash実行を禁止
          CLAUDE_OUTPUT=$(claude -p "$PROMPT" --allowedTools "Read,Glob,Grep" 2>&1)
          echo "$CLAUDE_OUTPUT"

          # レビューコメントを抽出してGitHub PRに投稿（安全なシェル変数経由）
          REVIEW_BODY=$(echo "$CLAUDE_OUTPUT" | python3 -c "
import sys, re
text = sys.stdin.read()
m = re.search(r'REVIEW_COMMENT_START\n(.*?)\nREVIEW_COMMENT_END', text, re.DOTALL)
if m:
    print(m.group(1)[:2000])
else:
    print('（レビュー本文抽出失敗）')
")

          # QA結果JSONを抽出してファイルに書き出す
          echo "$CLAUDE_OUTPUT" | python3 -c "
import sys, re, json
text = sys.stdin.read()
m = re.search(r'QA_RESULT_START\n(.*?)\nQA_RESULT_END', text, re.DOTALL)
if m:
    try:
        data = json.loads(m.group(1).strip())
        with open('/tmp/qa_result.json', 'w') as f:
            json.dump(data, f)
        print('qa_result.json 書き出し完了')
    except Exception as e:
        print(f'JSON解析失敗: {e}')
else:
    print('QA_RESULT_START/END マーカーが見つかりません')
"

          # PRにレビューコメントを投稿
          if [ -n "$REVIEW_BODY" ] && [ "$REVIEW_BODY" != "（レビュー本文抽出失敗）" ]; then
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "$REVIEW_BODY"
          fi

      - name: P0/P1検出時に修正タスクをキューへ追加
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f /tmp/qa_result.json ]; then
            echo "qa_result.json なし（レビュースキップ or エラー）"
            exit 0
          fi

          MAX_SEV=$(python3 -c "import json; d=json.load(open('/tmp/qa_result.json')); print(d.get('max_severity','ok'))")
          echo "最大重要度: ${MAX_SEV}"

          if [ "$MAX_SEV" != "p0" ] && [ "$MAX_SEV" != "p1" ]; then
            echo "P0/P1なし → キュー追加スキップ"
            exit 0
          fi

          TASK_DATE=$(date +%Y%m%d-%H%M%S)
          REPO_SLUG=$(echo "$REPO" | tr '/' '-')
          TASK_ID="${TASK_DATE}-qa-fix-${REPO_SLUG}-pr${PR_NUMBER}"

          cd /tmp
          rm -rf mgt-qa-tmp
          # GH_TOKENをURLやextraheaderに直接埋め込まず、GIT_ASKPASSを使用してログ・プロセス一覧への漏洩を防ぐ
          ASKPASS_SCRIPT=$(mktemp /tmp/askpass-XXXXXX.sh)
          printf '#!/bin/sh\necho "%s"\n' "${GH_TOKEN}" > "$ASKPASS_SCRIPT"
          chmod +x "$ASKPASS_SCRIPT"
          GIT_ASKPASS="$ASKPASS_SCRIPT" git clone https://github.com/boro74/money-mgt.git mgt-qa-tmp
          rm -f "$ASKPASS_SCRIPT"
          cd mgt-qa-tmp
          # push用のリモートURLも同様に認証情報をURLに埋め込まない設定
          PUSH_ASKPASS=$(mktemp /tmp/askpass-XXXXXX.sh)
          printf '#!/bin/sh\necho "%s"\n' "${GH_TOKEN}" > "$PUSH_ASKPASS"
          chmod +x "$PUSH_ASKPASS"
          git config core.askPass "$PUSH_ASKPASS"

          TASK_ID="$TASK_ID" \
          REPO="$REPO" \
          PR_NUMBER="$PR_NUMBER" \
          PR_BRANCH="$PR_BRANCH" \
          PR_TITLE="$PR_TITLE" \
          MAX_SEV="$MAX_SEV" \
          python3 - <<'PYEOF'
          import json, os
          from pathlib import Path
          from datetime import datetime

          qa        = json.loads(Path("/tmp/qa_result.json").read_text())
          repo      = os.environ["REPO"]
          pr_num    = int(os.environ["PR_NUMBER"])
          pr_branch = os.environ["PR_BRANCH"]
          pr_title  = os.environ["PR_TITLE"]
          max_sev   = os.environ["MAX_SEV"]
          task_id   = os.environ["TASK_ID"]
          issues    = qa.get("issues_text", "")

          pr_url    = f"https://github.com/{repo}/pull/{pr_num}"
          sev_label = "P0（必須修正）" if max_sev == "p0" else "P1（要対応）"
          desc = (
              f"PR #{pr_num} のQAレビューで {sev_label} 問題が検出されました。\n\n"
              f"【PR情報】\n- リポジトリ: {repo}\n- PR URL: {pr_url}\n"
              f"- ブランチ: {pr_branch}\n- タイトル: {pr_title}\n\n"
              f"【検出された問題】\n{issues}\n\n"
              f"【対応手順】\n"
              f"1. implementation-agent が {pr_url} のレビューコメントを読む\n"
              f"2. ブランチ {pr_branch} にチェックアウトして修正を実装・push する\n"
              f"3. push 後に QAレビューが自動再実行される"
          )

          queue_path = Path("director/task-queue/queue.json")
          data  = json.loads(queue_path.read_text(encoding="utf-8"))
          tasks = data if isinstance(data, list) else data.get("tasks", [])
          now   = datetime.now().isoformat()

          new_task = {
              "task_id":        task_id,
              "title":          f"QAレビュー指摘修正: {repo} PR#{pr_num}（{max_sev}）",
              "status":         "pending",
              "priority":       "high" if max_sev == "p0" else "medium",
              "authority_level":"L1",
              "source_agent":   "qa-review-bot",
              "target_agent":   "dev-supervisor",
              "description":    desc,
              "input_files":    [],
              "output_path":    "dev-headquarters/product-dev/implementation/",
              "output_filename":f"qa-fix-{repo.replace('/', '-')}-pr{pr_num}.md",
              "created_at":     now,
              "updated_at":     now,
              "blocked_reason": None,
              "depends_on":     [],
              "metadata": {
                  "pr_repo":     repo,
                  "pr_number":   pr_num,
                  "pr_branch":   pr_branch,
                  "max_severity":max_sev,
                  "source":      "qa-review-workflow"
              }
          }

          tasks.append(new_task)
          if isinstance(data, list):
              queue_path.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          else:
              data["tasks"] = tasks
              queue_path.write_text(json.dumps(data, ensure_ascii=False, indent=2))

          print(f"タスク追加完了: {new_task['task_id']}")
          PYEOF

          git config user.name "qa-review-bot [bot]"
          git config user.email "qa-review@money-mgt.net"
          git add director/task-queue/queue.json
          git diff --staged --quiet && echo "変更なし" && rm -f "${PUSH_ASKPASS:-}" && exit 0
          git commit -m "task: QAレビュー修正タスク追加 ${REPO} PR#${PR_NUMBER} [${MAX_SEV}]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && GIT_ASKPASS="${PUSH_ASKPASS}" GIT_USERNAME="x-access-token" git push && break
            echo "push retry $i/3..."
            sleep $((i * 3))
          done
          rm -f "${PUSH_ASKPASS:-}"
          echo "✅ queue.json にタスクを追加しました: ${TASK_ID}"

      - name: QAパス時に代表へ承認依頼（money-mgt Issue）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f /tmp/qa_result.json ]; then
            echo "qa_result.json なし → スキップ"
            exit 0
          fi

          MAX_SEV=$(python3 -c "import json; d=json.load(open('/tmp/qa_result.json')); print(d.get('max_severity','ok'))")

          if [ "$MAX_SEV" = "p0" ] || [ "$MAX_SEV" = "p1" ]; then
            echo "P0/P1あり → 承認依頼スキップ（修正タスク作成済み）"
            exit 0
          fi

          # PR_TITLE のサニタイズ（シェルインジェクション対策：制御文字・<>・バッククォートを除去）
          PR_TITLE_SAFE=$(printf '%s' "${PR_TITLE}" | python3 -c "import sys, re; t=sys.stdin.read().strip()[:100]; print(re.sub(r'[\x00-\x1f\x7f\`<>]', '', t))")
          PR_URL="https://github.com/${REPO}/pull/${PR_NUMBER}"
          MGT_REPO="boro74/money-mgt"

          if [ "$MAX_SEV" = "ok" ]; then
            QA_BADGE="✅ QA全項目クリア（P0/P1/P2 なし）"
          else
            QA_BADGE="🟡 P2（軽微な改善提案）のみ — マージ可能レベル"
          fi

          # money-mgt で同 PR URL を含むオープン Issue を検索
          EXISTING=$(gh issue list --repo "$MGT_REPO" --state open \
            --search "${PR_URL}" --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$MGT_REPO" \
              --body "## ✅ QAレビュー クリア — Approve をお願いします

          ${QA_BADGE}

          👉 **[PR #${PR_NUMBER} を Approve・マージする](${PR_URL})**

          ---
          *QAレビューbot 自動追記 $(date '+%Y-%m-%d %H:%M %Z')*"
            echo "✅ money-mgt Issue #${EXISTING} にコメント追記しました"
          else
            # PR_TITLEをシェル展開リスクを避けるため変数経由で渡す（シェルインジェクション対策）
            ISSUE_TITLE="【L3: PR承認依頼】${REPO} #${PR_NUMBER} ${PR_TITLE_SAFE}"
            gh issue create \
              --repo "$MGT_REPO" \
              --title "$ISSUE_TITLE" \
              --body "## 代表アクション

          👉 **[PR #${PR_NUMBER} を確認・Approve・マージする](${PR_URL})**

          ---

          ## QA結果サマリー

          | 項目 | 内容 |
          |------|------|
          | PR | [#${PR_NUMBER}: ${PR_TITLE}](${PR_URL}) |
          | QA判定 | ${QA_BADGE} |
          | ブランチ | \`${PR_HEAD_BRANCH}\` → \`${PR_BASE_BRANCH}\` |

          ## 手順

          1. 上記 PR リンクを開いてコードを確認する
          2. money-mgt-website で **Approve → Merge** を実施する
          3. 本 Issue を Close する

          ---
          *QAレビューbot 自動起票 $(date '+%Y-%m-%d %H:%M %Z')*"
            echo "✅ money-mgt に承認依頼 Issue を起票しました（PR #${PR_NUMBER}）"
          fi

      - name: 失敗時にIssue起票
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pr = context.payload.pull_request;
            const prNumber = pr ? pr.number : 'N/A';
            const prTitle = pr ? String(pr.title) : 'N/A';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `[⚠️ 自動通知] PR自動コードレビューが失敗しました (PR #${prNumber})`,
              labels: ['workflow-failure'],
              body: [
                '## ワークフロー失敗通知',
                '',
                `- **PR**: #${prNumber} ${prTitle}`,
                `- **実行URL**: ${runUrl}`,
                '',
                'QAレビューワークフローが失敗しました。手動でレビューを実施してください。',
              ].join('\n'),
            });
