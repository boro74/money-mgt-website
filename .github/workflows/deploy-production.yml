name: 本番デプロイ（money-mgt.net）

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Hugo ビルド → FTP デプロイ（本番）
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: リポジトリをチェックアウト（サブモジュール含む）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ガード① Secret未設定チェック
        run: |
          if [ -z "${{ secrets.FTP_SERVER_DIR }}" ]; then
            echo "ERROR: FTP_SERVER_DIR が未設定です。デプロイを中止します。"
            echo "GitHub リポジトリ Settings → Secrets で以下を設定してください:"
            echo "  FTP_SERVER_DIR = hugo/"
            exit 1
          fi
          echo "OK: FTP_SERVER_DIR が設定されています"

      - name: ガード② devパス誤設定チェック（本番に dev が入っていないこと）
        run: |
          TARGET="${{ secrets.FTP_SERVER_DIR }}"
          echo "デプロイ先パス: ${TARGET}"
          if [[ "${TARGET}" == *"dev"* ]]; then
            echo "ERROR: FTP_SERVER_DIR に 'dev' が含まれています（ステージングパスへの誤爆防止）"
            echo "本番用には hugo/ を設定してください"
            exit 1
          fi
          echo "OK: 本番パスを確認しました"

      - name: ガード③ デプロイ前サマリー表示
        run: |
          echo "========================================"
          echo "  [本番デプロイ] money-mgt.net"
          echo "  デプロイ先 : ${{ secrets.FTP_SERVER_DIR }}"
          echo "  ブランチ   : ${{ github.ref_name }}"
          echo "  コミット   : ${{ github.sha }}"
          echo "  実行者     : ${{ github.actor }}"
          echo "========================================"

      - name: Hugo セットアップ
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Hugo ビルド（本番 baseURL）
        run: hugo --minify

      - name: FTP デプロイ → LOLIPOP hugo/
        # セキュリティ注記（QA P1再指摘 2026-08-02 対応・2026-08-03修正）:
        #   PR #14 は「LOLIPOP が FTPS 非対応」という未検証の前提で protocol: ftps→ftp
        #   （平文化）への切り戻しを提案していたが、実際には protocol: ftps のまま
        #   本番稼働してきた実行履歴（run 28683278081 2026-07-03 / 30174943916 2026-07-25 /
        #   30689153103・30703312589 2026-08-01、いずれも success・ファイルアップロード成功を
        #   ログで確認済み）があり、LOLIPOP は本アカウントで FTPS に対応していることが実証済み。
        #   よって ftp への切り戻しは不要かつ平文化による退行のため行わず、ftps を維持する。
        #   さらなる強化として SFTP（SSH鍵認証）はロリポップのスタンダードプラン以上でのみ
        #   利用可能（ライト/エコノミープランはSSH機能自体が非提供）と判明。本アカウントの
        #   契約プランを代表に確認できていないため、SFTP移行の要否は Issue #16 で追跡継続する。
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/Thumbs.db
          dangerous-clean-slate: false

      - name: デプロイ完了通知
        if: success()
        run: |
          echo "本番環境へのデプロイが完了しました"
          echo "（LOLIPOPパネルで公開フォルダを hugo/ に切り替えると反映されます）"
          echo "デプロイ先: ${{ secrets.FTP_SERVER_DIR }}"
          echo "コミット: ${{ github.sha }}"

      - name: デプロイ失敗通知
        if: failure()
        run: |
          echo "本番環境へのデプロイに失敗しました"
          echo "コミット: ${{ github.sha }}"
          echo "ブランチ: ${{ github.ref_name }}"
